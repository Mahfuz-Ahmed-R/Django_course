{%extends 'base.html'%} {%load crispy_forms_tags%} {%block content%}
<div class="row">
  <div class="col-7">
    <form class="mt-3" method="post" style="margin: 15px">
      {%csrf_token%} {{form | crispy}}
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
  <div class="col-5">
    <h2 style="margin-left: 7px">Latest Posts</h2>
    <ul class="list-group list-group-flush" style="width: 70%">
      {%for p in data reversed%}
      <a href="{%url 'detailedview' p.id%}" class="text-decoration-none">
        <li class="list-group-item m-2">
          <small>{{p.name}} || {{p.created_at}}</small>
        </li>
      </a>
      {%endfor%}
    </ul>
  </div>
</div>
{%endblock%}
