{%extends 'base.html'%} {%load crispy_forms_tags%} {%block content%}
<form class="mt-3" method="post" style="width: 50%; margin: auto">
  {%csrf_token%}
  <h2 class="mb-3">{{type}} Page</h2>
  {{form | crispy}} {%if type == 'Password Change'%}
  <p>
    <a href="{%url 'pass_change_without_old_pass'%}">Change without password</a>
  </p>
  {%endif%}
  <button type="submit" class="btn btn-primary" id="liveToastBtn">
    {{type}}
  </button>
</form>
{%endblock%}
