<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Authentication</title>
  </head>
  <body style="background-color: #e4e4e4">
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark">
        <div class="container-fluid">
          <a
            class="navbar-brand btn btn-info text-decoration-none"
            href="{%url 'homepage'%}"
            >Authenticator</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              {%if request.user.is_authenticated%}
              <li class="nav-item">
                <a
                  class="nav-link active btn btn-warning text-white"
                  aria-current="page"
                  href="{%url 'profile'%}"
                  >Profile</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link btn btn-danger text-white"
                  href="{%url 'logout'%}"
                  style="margin-left: 10px"
                  >Logout</a
                >
              </li>
              {%else%}
              <li class="nav-item">
                <a
                  class="nav-link active btn btn-success text-white"
                  aria-current="page"
                  href="{%url 'register'%}"
                  >Signup</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link btn btn-primary text-white"
                  href="{%url 'login'%}"
                  style="margin-left: 10px"
                  >Login</a
                >
              </li>
              {%endif%}
            </ul>
          </div>
        </div>
      </nav>
      {%for m in messages%}
      <h3 class="text-{{m.tags}}">{{m}}</h3>
      {%endfor%} {% block content %}
      <h1>Welcome to Autheticator</h1>
      {% endblock %}
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
