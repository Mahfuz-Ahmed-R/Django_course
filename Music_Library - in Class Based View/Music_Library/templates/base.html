<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Music Library</title>
  </head>
  <body style="background: aqua">
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark">
        <div class="container-fluid">
          <a
            class="navbar-brand active"
            aria-current="page"
            href="{%url 'homepage'%}"
            >Music Library</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" style="width: 50%">
              {%if request.user.is_authenticated%}
              <li class="nav-item">
                <a
                  class="nav-link btn btn-info text-decoration-none text-dark"
                  href="{%url 'add_musician'%}"
                  >Add Musician</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link btn btn-primary text-decoration-none text-dark"
                  href="{%url 'add_album'%}"
                  style="margin-left: 10px"
                  >Add Album</a
                >
              </li>
            </ul>
            <div class="d-flex">
              <a
                class="nav-link btn btn-success text-decoration-none text-dark"
                href="{%url 'profile'%}"
                >Profile</a
              >
              <a
                class="nav-link btn btn-danger text-decoration-none text-dark"
                href="{%url 'logout'%}"
                style="margin-left: 10px"
                >Logout</a
              >
            </div>
            {%else%}
            <div class="d-flex">
              <a
                class="nav-link btn btn-warning text-decoration-none text-dark"
                href="{%url 'registration'%}"
                >Signup</a
              >
              <a
                class="nav-link btn btn-info text-dark"
                href="{%url 'login'%}"
                style="margin-left: 10px"
                >Login</a
              >
            </div>
            {%endif%}
          </div>
        </div>
      </nav>
      {%for m in messages%}
      <div class="alert alert-{{m.tags}}" role="alert">{{m}}</div>
      {%endfor%} {%block content%} {%endblock%}
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
